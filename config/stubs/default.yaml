# Default stub configuration.
# Contains defaults for all mandatory fields.
# Used as the starting template when no config exists in the target repository.

version: "1"

project:
  name: ""
  path: ""

tools:
  - name: "code_commenting"
    enabled: true
    description: "Adds inline code comments to pull requests"
  - name: "docusaurus_sync"
    enabled: false
    description: "Syncs code documentation to a Docusaurus site"
  - name: "changelog_gen"
    enabled: true
    description: "Auto-generates changelog from commit messages"

branch_rules:
  - branch: "main"
    triggers:
      - "push"
    tools:
      - "changelog_gen"
  - branch: "develop"
    triggers:
      - "push"
      - "pull_request"
    tools:
      - "code_commenting"
