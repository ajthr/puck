name: Build and Release

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || 'develop' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p releases
          BINARY_NAME=puck-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -o "releases/${BINARY_NAME}" main.go

      - name: Manage Rolling Tag
        run: |
          TAG_NAME=${{ github.event_name == 'pull_request' && 'latest' || 'canary' }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $TAG_NAME
          git push -f origin $TAG_NAME

      - name: Upload Binaries to Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'pull_request' && 'latest' || 'canary' }}
          commit: ${{ github.sha }}
          name: ${{ github.event_name == 'pull_request' && 'Latest Release' || 'Canary Build' }}
          prerelease: ${{ github.event_name == 'push' }}
          makeLatest: ${{ github.event_name == 'pull_request' }}
          artifacts: "releases/*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
